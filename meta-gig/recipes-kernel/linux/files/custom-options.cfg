# Include driver support for Intel 2.5GB Ethernet devices
CONFIG_IGC=y

# Include driver support for Nano's Ethernet adapater
CONFIG_R8169=y

# Enable nftables support
CONFIG_NFT_COMPAT=y
CONFIG_NFT_CT=y
CONFIG_NFT_COUNTER=y
CONFIG_NFT_NAT=y
CONFIG_NFT_MASQ=y
CONFIG_NFT_REDIR=y
CONFIG_NFT_REJECT=y

# Include bridge filter module for containers
CONFIG_BRIDGE=y
CONFIG_BRIDGE_NETFILTER=y

# Include kernel level support for WireGuard
CONFIG_WIREGUARD=y

