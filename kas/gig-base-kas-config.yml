local_conf_header:
  tegra: |
    # these two classes only work as intended when being inherited in the
    # OE4t setup-env.sh style environment, as they modify bblayers.conf
    # and expect additional information on the host.
    INHERIT:remove = "tegra-support-sanity distro_layer_buildinfo"
    INHERIT += "image-buildinfo"
    IMAGE_BUILDINFO_VARS:append = "DATETIME DISTRO_NAME IMAGE_BASENAME MACHINE TUNE_PKGARCH"
    IMAGE_BUILDINFO_VARS:append = "MACHINE_FEATURES DISTRO_FEATURES COMMON_FEATURES IMAGE_FEATURES"
    IMAGE_BUILDINFO_VARS:append = "TUNE_FEATURES TARGET_FPU"
    PACKAGE_CLASSES += "package_deb"
    EXTRA_IMAGE_FEATURES ?= "allow-empty-password empty-root-password allow-root-login package-management"
    DOCKER_OCI_RUNTIMES = '{"nvidia":{"args":[],"path":"nvidia-container-runtime"}}'
    DOCKER_DEFAULT_RUNTIME = "nvidia"
